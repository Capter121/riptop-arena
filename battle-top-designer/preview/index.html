<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Spin System — Phase 2B Preview</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three/0.185.1/build/three.module.js","three/addons/":"./vendor/three/0.185.1/examples/jsm/"}}
  </script>
</head>
<body>
  <main>
    <header>
      <div><span class="eyebrow">NSS-V1 / PHASE 2B</span><h1>Quality Gate Preview</h1></div>
      <div class="controls">
        <label for="model-select">Model</label>
        <select id="model-select">
          <optgroup label="Main Blades">
            <option value="blade_storm_fang">Storm Fang</option>
            <option value="blade_iron_bastion">Iron Bastion</option>
            <option value="blade_orbit_halo">Orbit Halo</option>
            <option value="blade_dual_comet">Dual Comet</option>
          </optgroup>
          <optgroup label="Emblem Cores">
            <option value="core_solar_wolf">Solar Wolf Core</option>
            <option value="core_void_falcon">Void Falcon Core</option>
          </optgroup>
          <optgroup label="Assist Rings">
            <option value="assist_heavy">Heavy Assist</option>
            <option value="assist_guard">Guard Assist</option>
            <option value="assist_air">Air Assist</option>
          </optgroup>
          <optgroup label="Height Gears">
            <option value="gear_low">Low Gear</option>
            <option value="gear_medium">Medium Gear</option>
            <option value="gear_high">High Gear</option>
          </optgroup>
          <optgroup label="Performance Tips">
            <option value="tip_flat_attack">Flat Attack Tip</option>
            <option value="tip_ball_defense">Ball Defense Tip</option>
            <option value="tip_needle_stamina">Needle Stamina Tip</option>
            <option value="tip_taper_balance">Taper Balance Tip</option>
          </optgroup>
          <optgroup label="Representative Assemblies">
            <option value="assembly_phase2b_attack_representative">Attack Representative</option>
            <option value="assembly_phase2b_defense_representative">Defense Representative</option>
            <option value="assembly_phase2b_stamina_representative">Stamina Representative</option>
            <option value="assembly_phase2b_balance_representative">Balance Representative</option>
          </optgroup>
        </select>
        <button id="reset-camera" type="button">Reset</button>
      </div>
    </header>
    <section id="viewport" aria-label="3D model viewport"></section>
    <footer><span id="load-status">Idle</span><span id="model-id">—</span></footer>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
