<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Nova Spin System</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #f4f7ff; background: #07101c; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(44rem, calc(100% - 2rem)); text-align: center; }
      h1 { margin-bottom: .5rem; }
      p { color: #aebbd0; }
      nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; margin-top: 2rem; }
      a { padding: 1.4rem; border: 1px solid #2d6fa3; border-radius: 1rem; color: inherit; text-decoration: none; background: #0d2135; }
      a:hover, a:focus-visible { border-color: #62d7ff; background: #12304d; }
      strong { display: block; font-size: 1.15rem; margin-bottom: .35rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Nova Spin System</h1>
      <p>设计你的五层陀螺组合，并将同一配置带入 RIPTOP Arena。</p>
      <nav aria-label="产品入口">
        <a href="./customizer/"><strong>定制陀螺</strong>选择并预览 NSS-V1 零件组合</a>
        <a href="./arena/"><strong>进入竞技场</strong>使用已保存组合开始战斗</a>
      </nav>
    </main>
  </body>
</html>
